name: API Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Info da máquina
        run: |
          echo "ImageOS=$ImageOS ImageVersion=$ImageVersion"
          nproc
          free -m
          df -h /
          lscpu | grep -E "Model name|^CPU\(s\)" || true
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: mvn -B test
      - name: Gerar relatório Allure
        if: always()
        run: mvn -B allure:report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: target/site/allure-maven-plugin
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: target/allure-results
